name: release-cloud
on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -r dio-grind-pwa.zip index.html styles.css app.js manifest.webmanifest sw.js assets README.md
      - uses: actions/upload-artifact@v4
        with:
          name: dio-grind-pwa
          path: dio-grind-pwa.zip
